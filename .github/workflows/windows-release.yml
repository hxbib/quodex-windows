name: Windows portable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:windows
      - name: Guard zip size
        shell: bash
        run: |
          bytes=$(wc -c < artifacts/Quodex-windows-x64.zip)
          echo "zip bytes=$bytes"
          test "$bytes" -gt 200000
          test "$bytes" -lt 20000000
      - uses: actions/upload-artifact@v4
        with:
          name: Quodex-windows-x64
          path: |
            artifacts/Quodex-windows-x64.zip
            artifacts/SHA256SUMS.txt
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Quodex for Windows ${{ github.ref_name }}
          body_path: GITHUB-RELEASE.md
          fail_on_unmatched_files: true
          files: |
            artifacts/Quodex-windows-x64.zip
            artifacts/SHA256SUMS.txt
